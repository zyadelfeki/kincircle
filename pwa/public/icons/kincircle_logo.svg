<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Main protective circle - solid blue -->
  <circle cx="512" cy="512" r="400" 
          fill="#4285F4" 
          stroke="none"/>
  
  <!-- Simplified house structure - flat design -->
  <g transform="translate(512,512)">
    
    <!-- House base - simple rectangle -->
    <rect x="-80" y="-20" width="160" height="120" 
          fill="#34A853"/>
    
    <!-- Roof - simple triangle -->
    <path d="M-100,-20 L0,-120 L100,-20 Z" 
          fill="#34A853"/>
    
  </g>
  
  <!-- Family dots in protective arc above house -->
  <circle cx="412" cy="320" r="16" fill="#ffffff"/>
  <circle cx="480" cy="280" r="16" fill="#ffffff"/>
  <circle cx="544" cy="280" r="16" fill="#ffffff"/>
  <circle cx="612" cy="320" r="16" fill="#ffffff"/>
  
</svg>
