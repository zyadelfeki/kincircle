<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Teal gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E86AB;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#48A9A6;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Sapphire gradient -->
    <linearGradient id="sapphireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#3D5A80;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Light teal gradient -->
    <linearGradient id="lightTealGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#48A9A6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#2E86AB;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <radialGradient id="accentGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2E86AB;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- White background -->
  <rect width="1024" height="500" fill="#FFFFFF"/>
  
  <!-- Large background circle - bottom right -->
  <circle cx="900" cy="450" r="350" fill="url(#sapphireGrad)" />
  
  <!-- Large background circle - top left -->
  <circle cx="150" cy="80" r="280" fill="url(#lightTealGrad)" />
  
  <!-- Medium circle - center left -->
  <circle cx="320" cy="320" r="200" fill="url(#tealGrad)" />
  
  <!-- Medium circle - top right -->
  <circle cx="750" cy="120" r="180" fill="url(#sapphireGrad)" />
  
  <!-- Small accent circle - center -->
  <circle cx="512" cy="250" r="150" fill="url(#accentGrad)" />
  
  <!-- Small decorative circles -->
  <circle cx="650" cy="380" r="100" fill="url(#lightTealGrad)" />
  <circle cx="200" cy="180" r="80" fill="url(#sapphireGrad)" />
  
  <!-- Subtle ring elements -->
  <circle cx="400" cy="150" r="60" fill="none" stroke="url(#tealGrad)" stroke-width="2" opacity="0.5"/>
  <circle cx="800" cy="300" r="90" fill="none" stroke="url(#sapphireGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="550" cy="420" r="70" fill="none" stroke="url(#lightTealGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Very subtle small circles for depth -->
  <circle cx="100" cy="400" r="120" fill="url(#tealGrad)" opacity="0.3"/>
  <circle cx="950" cy="100" r="100" fill="url(#lightTealGrad)" opacity="0.4"/>
</svg>