<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Main protective circle - solid blue -->
  <circle cx="512" cy="512" r="400" 
          fill="#4285F4" 
          stroke="none"/>
  
  <!-- Unified house and dots composition - larger and connected -->
  <g transform="translate(512,512) scale(1.2)">
    
    <!-- Softened house structure - raised to connect with dots -->
    <g transform="translate(0,-40)">
      
      <!-- House base - softened corners -->
      <rect x="-75" y="0" width="150" height="110" 
            fill="#34A853"
            rx="8" ry="8"/>
      
      <!-- Roof - wider, less pointed, softened -->
      <path d="M-90,0 Q-90,-5 -85,-5 L-5,-80 Q0,-85 5,-80 L85,-5 Q90,-5 90,0 Z" 
            fill="#34A853"/>
      
    </g>
    
    <!-- Family dots - positioned to form unified arc that connects with house -->
    <circle cx="-110" cy="-65" r="14" fill="#ffffff"/>
    <circle cx="-40" cy="-95" r="14" fill="#ffffff"/>
    <circle cx="40" cy="-95" r="14" fill="#ffffff"/>
    <circle cx="110" cy="-65" r="14" fill="#ffffff"/>
    
  </g>
  
</svg>
