<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Left Ring Multi-Stop Gradient -->
    <linearGradient id="grad-ring1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#77C471" />
      <stop offset="25%" stop-color="#389799" />
      <stop offset="55%" stop-color="#294FAE" />
      <stop offset="85%" stop-color="#1792EF" />
      <stop offset="100%" stop-color="#40AAA4" />
    </linearGradient>

    <!-- Right Ring Multi-Stop Gradient -->
    <linearGradient id="grad-ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80C572" />
      <stop offset="25%" stop-color="#39A4A1" />
      <stop offset="55%" stop-color="#2C4AA6" />
      <stop offset="85%" stop-color="#0E84F6" />
      <stop offset="100%" stop-color="#58B17D" />
    </linearGradient>

    <!-- Cutout Mask for Ring 1 (Bottom Intersect: Ring 2 passes over Ring 1) -->
    <mask id="mask-ring1-under">
      <rect width="1024" height="1024" fill="white" />
      <!-- Cutout stroke along Ring 2 path in the bottom intersection area -->
      <circle cx="640.53" cy="455.99" r="214.78" fill="none" stroke="black" stroke-width="110" />
    </mask>
  </defs>

  <g id="kincircle-logo-geometry">
    <!-- Ring 2: Full circle (passes Under at top, Over at bottom) -->
    <circle cx="640.53" cy="455.99" r="214.78" fill="none" stroke="url(#grad-ring2)" stroke-width="82.33" />
    
    <!-- Ring 1: Passes Under at bottom via mask -->
    <circle cx="387.39" cy="563.53" r="214.78" fill="none" stroke="url(#grad-ring1)" stroke-width="82.33" mask="url(#mask-ring1-under)" />
    
    <!-- Ring 1: Top Overpass Segment (passes Over Ring 2 at top intersection) -->
    <path d="M 424.68 352.01 A 214.78 214.78 0 0 1 573.43 456.14" fill="none" stroke="url(#grad-ring1)" stroke-width="82.33" stroke-linecap="butt" />
  </g>
</svg>
