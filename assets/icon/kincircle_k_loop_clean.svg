<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Plain white background -->
  <rect width="1024" height="1024" fill="#ffffff"/>
  
  <!-- K-Loop monogram - bold and minimalist -->
  <g transform="translate(512,512)">
    
    <!-- Main vertical stem -->
    <rect x="-200" y="-300" width="60" height="600" 
          fill="#0078FF" 
          rx="30" ry="30"/>
    
    <!-- Upper diagonal -->
    <rect x="-140" y="-120" width="160" height="60" 
          fill="#0078FF" 
          rx="30" ry="30"
          transform="rotate(-30)"/>
    
    <!-- Perfect circle loop -->
    <circle cx="80" cy="-20" r="120" 
            fill="none" 
            stroke="#0078FF" 
            stroke-width="60"/>
    
    <!-- Lower diagonal connecting back -->
    <rect x="-140" y="60" width="160" height="60" 
          fill="#0078FF" 
          rx="30" ry="30"
          transform="rotate(30)"/>
    
  </g>
  
</svg>
