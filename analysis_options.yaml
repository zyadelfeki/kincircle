# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This enables the lint rules recommended by the Flutter team.
# https://flutter.dev/docs/development/tools/linter
#
# To see the full list of supported lint rules, see
# https://dart.dev/lints.
#
# For more information on configuring static analysis, see
# https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules are specified in the included file.
  # You can disable rules from that file here, and specify additional rules.
  rules:
    # Style rules
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - use_key_in_widget_constructors
    - unnecessary_const
    - avoid_print # Disallow print statements in production code.

    # Pub rules
    - sort_pub_dependencies

    # Member ordering
    - sort_constructors_first
    - prefer_single_quotes

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - ios/Pods/**
    - android/**/generated/**
    - node_modules/**
    # Explicitly exclude Cloud Functions workspace (Node/TS) and any nested copies
    - tool/**
    - test/**.mocks.dart
    - functions/**
    - functions/node_modules/**
    - "**/functions/**"
    - "**/node_modules/**"
    - "**/.dart_tool/**"
    - "**/tool/**"
  language:
    strict-casts: false
    strict-raw-types: false
