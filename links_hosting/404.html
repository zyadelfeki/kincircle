<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Not Found — KinCircle</title>
  <meta name="description" content="This link is expired or invalid." />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B132B;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      border-radius: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      background: #2E86AB;
      color: #FFFFFF;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="KinCircle Logo" class="logo" onerror="this.style.display='none'" />
    <h1>Page Not Found</h1>
    <p>This link is expired or invalid.</p>
    <a href="https://kincircle-live.web.app" class="btn">Get KinCircle</a>
  </div>
</body>
</html>
