name: kincircle
description: A Flutter application for connecting with family and friends.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  activity_recognition_flutter: ^5.0.0
  animations: ^2.0.11
  app_links: ^6.0.0
  cloud_firestore: ^6.0.1
  cloud_functions: ^6.0.1
  cupertino_icons: ^1.0.2
  firebase_auth: ^6.0.2
  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.1
  firebase_remote_config: ^6.0.1
  firebase_storage: ^13.0.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_fonts: ^6.3.1
  google_maps_flutter: ^2.13.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  image_picker: ^1.1.2
  in_app_purchase: ^3.1.11
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  permission_handler: ^12.0.1
  provider: ^6.1.5
  qr_flutter: ^4.1.0
  sensors_plus: ^6.0.1
  share_plus: ^11.1.0
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^7.0.1
  tflite_flutter: ^0.11.0
  url_launcher: ^6.3.0

dev_dependencies:
  fake_cloud_firestore: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.5.4
  integration_test:
    sdk: flutter
  mockito: ^5.5.1
  xml: ^6.5.0

flutter:
  uses-material-design: true
  assets:
  - assets/models/
  - docs/FAQ.md
  - assets/icon/kin_arc_final.svg
  - assets/logo/
  - assets/google_g.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/kin_arc_launcher_icon.png