name: kincircle
description: A Flutter application for connecting with family and friends.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  activity_recognition_flutter: ^6.0.0
  animations: ^2.1.1
  app_links: ^7.0.0
  battery_plus: ^6.0.3
  clipboard: ^0.1.3
  cloud_firestore: ^6.1.0
  cloud_functions: ^6.0.4
  crypto: ^3.0.7
  cupertino_icons: ^1.0.2
  encrypt: ^5.0.3
  firebase_app_check: ^0.4.2
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.5
  firebase_remote_config: ^6.1.2
  firebase_storage: ^13.0.4
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  flutter_tts: ^4.0.2
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_fonts: ^8.0.2
  google_maps_flutter: ^2.14.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image_picker: ^1.2.1
  in_app_purchase: ^3.1.11
  package_info_plus: ^9.0.1
  path_provider: ^2.1.4
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  sensors_plus: ^7.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  sign_in_with_apple: ^7.0.1
  tflite_flutter: ^0.12.1
  url_launcher: ^6.3.1

dev_dependencies:
  fake_cloud_firestore: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.5.4
  integration_test:
    sdk: flutter
  mockito: ^5.5.1
  xml: ^6.5.0

flutter:
  uses-material-design: true
  assets:
  - assets/models/
  - docs/FAQ.md

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/kin_arc_launcher_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/kin_arc_launcher_icon.png
